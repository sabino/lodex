[package]
name = "codex-lodex-cloud"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
cli = ["dep:clap", "dep:codex-core", "dep:codex-login", "dep:codex-model-provider", "dep:codex-utils-cli"]

[[bin]]
name = "lodex-cloud"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
bytes = { workspace = true }
codex-api = { workspace = true }
codex-http-client = { workspace = true }
codex-lodex-policy = { workspace = true }
http = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
url = { workspace = true }
clap = { workspace = true, features = ["derive"], optional = true }
codex-core = { workspace = true, optional = true }
codex-login = { workspace = true, optional = true }
codex-model-provider = { workspace = true, optional = true }
codex-utils-cli = { workspace = true, optional = true }

[dev-dependencies]
wiremock = { workspace = true }
