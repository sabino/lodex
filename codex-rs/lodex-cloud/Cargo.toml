[package]
name = "codex-lodex-cloud"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["chatgpt"]
chatgpt = ["dep:codex-api", "dep:codex-lodex-policy"]
api-cli = ["dep:clap"]
cli = ["chatgpt", "api-cli", "dep:clap", "dep:codex-core", "dep:codex-login", "dep:codex-model-provider", "dep:codex-utils-cli"]

[[bin]]
name = "lodex-cloud"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "lodex-agents"
path = "src/agents_main.rs"
required-features = ["api-cli"]

[dependencies]
bytes = { workspace = true }
codex-api = { workspace = true, optional = true }
codex-http-client = { workspace = true }
codex-lodex-policy = { workspace = true, optional = true }
http = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
url = { workspace = true }
clap = { workspace = true, features = ["derive"], optional = true }
codex-core = { workspace = true, optional = true }
codex-login = { workspace = true, optional = true }
codex-model-provider = { workspace = true, optional = true }
codex-utils-cli = { workspace = true, optional = true }

# Match the upstream musl TLS build without relying on codex-core feature unification.
[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]
openssl-sys = { workspace = true, features = ["vendored"] }

[dev-dependencies]
wiremock = { workspace = true }
tempfile = { workspace = true }
